name: Deploy Admin Dashboard to GitHub Pages

on:
  workflow_dispatch:
  # Disabled auto-deploy on push - use manual deployment script instead
  # push:
  #   branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./admin-dashboard
        run: npm install

      - name: Build dashboard
        working-directory: ./admin-dashboard
        run: npm run build
        env:
          PUBLIC_URL: /NexusCommerce

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./admin-dashboard/build
          cname: false